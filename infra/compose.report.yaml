# Report (1).docx: one shared API and shared-table database, with Redis 7.
# The bridge stack remains available through APP_VARIANT=bridge.
services:
  report-storage-init:
    image: postgres:16-alpine
    user: "0:0"
    entrypoint: ["sh", "-ec", "mkdir -p /resources/files && chown 10001:10001 /resources/files && chmod 700 /resources/files"]
    volumes: ["report-resources:/resources"]
    restart: "no"
  postgres:
    image: postgres:16-alpine
    cpus: 1.0
    mem_limit: 768m
    environment:
      PGDATA: /var/lib/postgresql/16/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    networks: [saas]
    cpus: 0.25
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    cpus: 1.0
    mem_limit: 768m
    depends_on: !override
      report-storage-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
    environment:
      REPORT_MODE: "true"
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RESOURCE_STORAGE_TYPE: filesystem
      RESOURCE_FILESYSTEM_ROOT: /verification-resources/files
    volumes: ["report-resources:/verification-resources"]
  worker:
    cpus: 0.5
    mem_limit: 512m
    depends_on: !override
      report-storage-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      REPORT_MODE: "true"
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RESOURCE_STORAGE_TYPE: filesystem
      RESOURCE_FILESYSTEM_ROOT: /verification-resources/files
    volumes: ["report-resources:/verification-resources"]
  web:
    cpus: 0.25
    mem_limit: 128m
  caddy:
    cpus: 0.25
    mem_limit: 128m
volumes:
  report-resources:
