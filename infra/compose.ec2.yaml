# Compose overlay specifically optimized for AWS EC2 m7i-flex.large (2 vCPU, 8 GiB RAM)
# Balances resource allocation across Spring Boot 3 API, PostgreSQL 16, Redis 7, and Web/Caddy
# Leaves ~3 GiB RAM and ~0.5 vCPU for the host OS and k6 load generator.

services:
  ec2-storage-init:
    image: postgres:16-alpine
    user: "0:0"
    entrypoint: ["sh", "-ec", "mkdir -p /resources/files && chown 10001:10001 /resources/files && chmod 700 /resources/files"]
    volumes: ["ec2-resources:/resources"]
    networks:
      - saas
    restart: "no"

  postgres:
    image: postgres:16-alpine
    # PostgreSQL is reachable by the app over the private Compose network.
    # Do not publish 5432 on the EC2 host: another service may already own it,
    # and the database should not need a host port for this deployment.
    ports: !override []
    cpus: 0.50
    mem_limit: 1536m
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=384MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "max_connections=120"
      - "-c"
      - "effective_cache_size=1GB"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7-alpine
    cpus: 0.25
    mem_limit: 512m
    command:
      - "redis-server"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "volatile-lru"
    networks:
      - saas
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  api:
    cpus: 1.25
    mem_limit: 2560m
    depends_on: !override
      ec2-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms1024m -Xmx1792m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"
      SERVER_TOMCAT_THREADS_MAX: "60"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "10"
      SERVER_TOMCAT_ACCEPT_COUNT: "100"
      POOL_DB_POOL_SIZE: "25"
      CONTROL_DB_POOL_SIZE: "10"
      REPORT_MODE: "true"
      REDIS_ENABLED: "true"
      REDIS_HOST: "redis"
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RESOURCE_STORAGE_TYPE: filesystem
      RESOURCE_FILESYSTEM_ROOT: /verification-resources/files
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      ACCOUNTS_SUBDOMAIN: ${ACCOUNTS_SUBDOMAIN:-accounts}
      PUBLIC_ACCOUNTS_URL: ${PUBLIC_ACCOUNTS_URL:-http://accounts.${BASE_DOMAIN:-localhost}:${HTTP_PORT:-8080}}
      PUBLIC_TENANT_URL_TEMPLATE: ${PUBLIC_TENANT_URL_TEMPLATE:-http://%s.${BASE_DOMAIN:-localhost}:${HTTP_PORT:-8080}}
      # Bug 3 fix: extend token TTL so pre-fetched tokens survive the full benchmark run.
      # Default PT10M would expire mid-run when seeding 80 users + running 2× 60s phases.
      ACCESS_TOKEN_TTL: "PT4H"
      REFRESH_TOKEN_TTL: "P7D"
    volumes:
      - "ec2-resources:/verification-resources"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  worker:
    cpus: 0.5
    mem_limit: 512m
    depends_on: !override
      ec2-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REPORT_MODE: "true"
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RESOURCE_STORAGE_TYPE: filesystem
      RESOURCE_FILESYSTEM_ROOT: /verification-resources/files
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    volumes:
      - "ec2-resources:/verification-resources"

  caddy:
    cpus: 0.25
    mem_limit: 256m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  web:
    cpus: 0.25
    mem_limit: 256m

volumes:
  ec2-resources:
